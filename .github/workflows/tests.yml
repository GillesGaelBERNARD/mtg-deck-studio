name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Manifest fields
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, yaml
          manifest = yaml.safe_load(pathlib.Path("plugin/plugin.yaml").read_text(encoding="utf-8"))
          for key in ("name", "version", "description", "author", "requires_hermes"):
              assert manifest.get(key), f"plugin.yaml is missing {key}"
          assert manifest["provides_tools"], "no tools declared"
          print("manifest ok:", manifest["name"], manifest["version"],
                len(manifest["provides_tools"]), "tools")
          PY
      - name: No private paths
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys
          # A published repo must not carry anybody's home directory, drive letter or profile path.
          bad = re.compile(r"(?:\b[A-Z]:[\\/]|/Users/[^/\s]+|/home/[^/\s]+|%LOCALAPPDATA%|\bAppData\b)")
          hits = []
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.as_posix() == ".github/workflows/tests.yml":
                  continue  # this file holds the pattern itself
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  if bad.search(line):
                      hits.append(f"{path}:{number}: {line.strip()[:120]}")
          if hits:
              print("private or machine-specific paths found:")
              print(chr(10).join(hits))
              sys.exit(1)
          print("no private paths")
          PY
      - name: Unit tests
        shell: bash
        run: python -m unittest discover -s plugin/tests -p "test_[cls]*.py" -v

  # The viewer tests drive the real pane in a sandboxed frame (data: URL iframe, postMessage),
  # so they need Playwright and a browser binary rather than the Hermes app. One OS is enough:
  # the viewer is web tech, and the download would double the matrix cost.
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Viewer tests (table, card dialog, links, sideboard)
        working-directory: plugin
        run: python -m unittest tests.test_viewer_browser -v
